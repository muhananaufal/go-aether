# GoReleaser configuration for go-aether
# Documentation: https://goreleaser.com
version: 2

project_name: go-aether

before:
  hooks:
    - go mod tidy
    - go test -v ./...

builds:
  - id: go-aether
    main: ./main.go
    binary: go-aether
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: muhananaufal
    name: go-aether
  draft: false
  prerelease: false
