version: "1"
project:
    name: skeleton-app
    module: github.com/test/skeleton
    go_version: "1.23"
    created_at: "2026-08-07T07:37:17+07:00"
    aether_version: 0.1.0
architecture:
    pattern: hexagonal
    mode: greenfield
    paths:
        domain: internal/core/domain
        port: internal/core/port
        service: internal/core/service
        handler_http: internal/adapter/handler/http
        repository: internal/adapter/repository
        cmd: cmd/server
        config: internal/config
        pkg: pkg
stack:
    router: chi
    database:
        driver: postgres
        orm: sqlc
        pool: pgxpool
    cache: none
    transport:
        - http
    auth: none
    logger: slog-otel
adapters:
    existing_db_var: ""
    existing_redis_var: ""
    existing_logger_var: ""
modules: []
workers: []
migrations:
    tool: goose
    dir: migrations/
lint:
    enabled: true
    config: .golangci.yml
test:
    coverage_threshold: 80
meta:
    anomaly_mode: false
    legacy_notes: ""
