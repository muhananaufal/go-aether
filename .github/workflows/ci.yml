name: CI Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Module Cleanliness
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run Test Suite
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Dry Run Build
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./main.go
