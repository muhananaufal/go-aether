name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# The Go version is declared once. go.mod is the source of truth for the
# language version, and a job pinned below it fails with a message that looks
# like a dependency problem rather than a configuration mistake.
env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Unit, Race & Compile Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Module Cleanliness
        run: |
          go mod tidy
          git diff --exit-code

      - name: Verify Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race needs cgo, which is unavailable on the maintainer's Windows box.
      # Linux CI is therefore the only place data races are actually detected,
      # and that makes this step non-negotiable rather than a nice-to-have.
      - name: Run Test Suite with Race Detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Dry Run Build
        run: CGO_ENABLED=0 go build -o /dev/null ./main.go

  security:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Installed and invoked directly rather than through golangci-lint-action.
      #
      # The action is versioned against a major line of the linter: v6 targets
      # golangci-lint v1, while `version: latest` now resolves to v2, whose CLI
      # and config format differ. That mismatch failed this job while the same
      # code reported zero issues locally.
      #
      # Pinning the exact version means CI runs the command a maintainer can
      # reproduce verbatim, and an upgrade becomes a deliberate commit rather
      # than something that happens on its own one morning.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint version
          golangci-lint run --timeout=5m
