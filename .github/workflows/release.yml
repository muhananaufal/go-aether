name: Release & Publish

on:
  push:
    tags:
      - 'v*' # Trigger automatically whenever a version tag like v1.0.0 is pushed

permissions:
  contents: write

jobs:
  goreleaser:
    name: Cross-Compile & Publish Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for accurate changelog generation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run GoReleaser Pipeline
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
