name: Release & Publish

on:
  push:
    tags:
      - 'v*' # Trigger automatically whenever a version tag like v1.0.0 is pushed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    name: Cross-Compile & Publish Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for accurate changelog generation

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Must not trail go.mod, or the release build fails with what looks
          # like a dependency error instead of a toolchain mismatch.
          go-version: '1.25'
          cache: true

      # GoReleaser shells out to syft for the SBOM. Without this step the release
      # fails late, after the builds have already run.
      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser Pipeline
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
